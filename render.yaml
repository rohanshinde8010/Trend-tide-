services:
  - type: web
    name: trendtide
    runtime: python
    buildCommand: "cd client && npm install && npm run build && cd .. && pip install -r requirements.txt"
    startCommand: "gunicorn server.app:app --bind 0.0.0.0:$PORT --workers 2 --threads 4"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: JWT_SECRET
        generateValue: true
      - key: APP_ENV
        value: production
      - key: APP_BASE_URL
        sync: false
      - key: SESSION_COOKIE_SECURE
        value: "true"
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_SECURE
        value: "false"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: RATELIMIT_STORAGE_URI
        sync: false
