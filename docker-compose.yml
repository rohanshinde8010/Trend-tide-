services:
  trendtide:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${PORT:-5001}:5001"
    env_file:
      - .env
    environment:
      APP_ENV: ${APP_ENV:-development}
    volumes:
      - trendtide-data:/app/database

volumes:
  trendtide-data:
